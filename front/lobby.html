<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatZone — Salas</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="lobby-page">
<div class="lobby-container">
    <div class="lobby-header">
        <div>
            <h1>💬 ChatZone</h1>
            <p class="tagline">Escolha uma sala e entre na conversa</p>
        </div>
        <button class="user-btn" id="user-btn" title="Meu perfil">👤</button>
    </div>

    <div class="rooms-grid" id="rooms-grid">
        <p style="color:var(--muted)">Carregando salas…</p>
    </div>
</div>

<!-- Modal perfil -->
<div class="modal-overlay" id="profile-modal">
    <div class="modal">
        <button class="modal-close" id="modal-close">✕</button>
        <h2>Meu Perfil</h2>
        <div class="profile-info">
            <p>Email: <span id="profile-email">—</span></p>
        </div>
        <button class="btn btn-logout btn-primary" id="btn-logout">Sair da conta</button>
    </div>
</div>

<script type="module" src="js/lobby.js"></script>
</body>
</html>
