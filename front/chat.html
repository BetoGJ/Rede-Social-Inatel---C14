<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatZone — Chat</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="chat-page">
<div class="chat-container">
    <div class="chat-header">
        <button class="back-btn" id="back-btn" title="Voltar">←</button>
        <div class="chat-header-info">
            <h2 id="room-name">Sala</h2>
            <span id="users-count" class="users-count">conectando…</span>
        </div>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="chat-input-area">
      <textarea
              id="msg-input"
              placeholder="Digite uma mensagem… (Enter para enviar)"
              rows="1"
              maxlength="500"
      ></textarea>
        <button class="send-btn" id="send-btn" disabled title="Enviar">➤</button>
    </div>
</div>

<script type="module" src="js/chat.js"></script>
</body>
</html>
