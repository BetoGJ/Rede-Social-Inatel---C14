<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatZone — Entrar</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-box">
        <h1>💬 ChatZone</h1>
        <p class="subtitle">Chats públicos em tempo real</p>

        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-login">Entrar</button>
            <button class="tab-btn" data-tab="tab-register">Criar conta</button>
        </div>

        <!-- Login -->
        <div id="tab-login" class="tab-panel active">
            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" placeholder="seu@email.com" autocomplete="email" />
                    <span id="login-email-err" class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label for="login-senha">Senha</label>
                    <input id="login-senha" type="password" placeholder="••••••••" autocomplete="current-password" />
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
        </div>

        <!-- Registro -->
        <div id="tab-register" class="tab-panel">
            <form id="form-register" novalidate>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input id="reg-email" type="email" placeholder="seu@email.com" autocomplete="email" />
                    <span id="reg-email-err" class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label for="reg-senha">Senha</label>
                    <input id="reg-senha" type="password" placeholder="••••••••" autocomplete="new-password" />
                    <p class="hint">Mín. 8 chars · 1 maiúscula · 1 número · 1 especial ($*&amp;@#!)</p>
                    <span id="reg-senha-err" class="error-msg"></span>
                </div>
                <button type="submit" class="btn btn-primary">Criar conta</button>
            </form>
        </div>
    </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
